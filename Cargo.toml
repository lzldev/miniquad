[package]
name = "miniquad"
version = "0.4.8"
authors = ["not-fl3 <not.fl3@gmail.com>"]
edition = "2018"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/not-fl3/miniquad"
repository = "https://github.com/not-fl3/miniquad"
description = """
Cross-platform window context and rendering library.
"""
readme = "README.md"
exclude = ["examples/"]
keywords = ["3D", "gamedev", "graphics", "opengl", "windowing"]
categories = ["rendering::graphics-api"]

[dev-dependencies]
fontdue = "0.8"
glam = { version = "0.24", features = ["scalar-math"] }
quad-rand = "0.1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc = { package = "objc-rs", version = "0.2" }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
ndk-sys = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
  "dwmapi",
  "errhandlingapi",
  "hidusage",
  "imm",
  "libloaderapi",
  "shellapi",
  "shellscalingapi",
  "winbase",
  "windef",
  "windowsx",
  "wingdi",
  "winuser",
] }

[features]
# Optional log-rs like macros implementation
# disabled by default
log-impl = []

[profile.release]
opt-level = "s"
strip = true
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
